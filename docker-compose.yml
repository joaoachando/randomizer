version: '3'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/usr/src/app/data
    environment:
      FLIGHTAWARE_API_KEY: ${FLIGHTAWARE_API_KEY:-}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-https://randomizer.achando.dev}
    restart: unless-stopped

  # Add this new service
  db-viewer:
    image: coleifer/sqlite-web
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - SQLITE_WEB_PASSWORD=pachando
    command: sqlite_web -H 0.0.0.0 /data/ideas.db
    restart: unless-stopped